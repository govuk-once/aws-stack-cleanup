name: Quality Checks

permissions:
  id-token: write
  contents: read

on:
  workflow_call:

jobs:
  AuthandCacheModules:
    name: 🧹 Auth to NPM and populate pnpm cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          run_install: false

      - name: Configure Aws Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: GH-Actions-Test-Stack-Cleanup

      - name: Configure CodeArtifact auth
        uses: govuk-once/platform-actions/.github/actions/codeartifact-auth@fff749cdfd839413978a28697eea25c8d2f9e1e7 # Arbitrary version at branch
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE_ARN }}
    
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get cache path
        shell: bash
        run: |
          echo "CACHE_PATH=node_modules" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Cache node_modules
        with:
          path: ${{ env.CACHE_PATH }}
          key: node_modules-${{ github.run_id }}-${{ github.run_attempt }}-AuthandCacheModules

  Linting:
    name: 🧹 Linting & Formatting
    runs-on: ubuntu-latest
    needs: AuthandCacheModules
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ github.run_id }}-${{ github.run_attempt }}-Linting
          restore-keys: |
            node_modules-${{ github.run_id }}-${{ github.run_attempt }}-AuthandCacheModules

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint check
        run: pnpm run lint:check

  TypeChecks:
    name: 🔍 Type Checks
    runs-on: ubuntu-latest
    needs: AuthandCacheModules
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ github.run_id }}-${{ github.run_attempt }}-TypeChecks
          restore-keys: |
            node_modules-${{ github.run_id }}-${{ github.run_attempt }}-AuthandCacheModules

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Static Typechecks
        run: pnpm run types:check

  UnitTests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: AuthandCacheModules
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ github.run_id }}-${{ github.run_attempt }}-UnitTests
          restore-keys: |
            node_modules-${{ github.run_id }}-${{ github.run_attempt }}-AuthandCacheModules

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm run test:unit

  CDKTests:
    name: 🦺  CDK Tests
    runs-on: ubuntu-latest
    needs: AuthandCacheModules
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ github.run_id }}-${{ github.run_attempt }}-CDKTests
          restore-keys: |
            node_modules-${{ github.run_id }}-${{ github.run_attempt }}-AuthandCacheModules

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run CDK Tests
        run: pnpm run test:cdk

  CDKSynth:
    name: 🔍 CDK Synth
    runs-on: ubuntu-latest
    needs: AuthandCacheModules
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ github.run_id }}-${{ github.run_attempt }}-CDKSynth
          restore-keys: |
            node_modules-${{ github.run_id }}-${{ github.run_attempt }}-AuthandCacheModules

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run CDK Synth
        run: pnpm run cdk synth

  CheckovScan:
    name: 🔍 Checkov Scan
    runs-on: ubuntu-latest
    needs: [AuthandCacheModules, CDKSynth]
    timeout-minutes: 10
    steps:
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: cdk.out
          config_file: .checkov.yaml
          baseline: .checkov.baseline
