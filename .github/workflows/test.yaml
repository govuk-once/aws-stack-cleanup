name: Test

on: [pull_request]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: 🧪 Test Code artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/workflows/_setup_environment.yml
        with:
          environment: 'test'

      - name: Run Tests
        run: pnpm run test

