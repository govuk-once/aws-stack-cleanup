name: Test
on: [pull_request]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # V6.4.0
        with:
          node-version: 'lts/*'
      - uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Configure Aws Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: GH-Actions-Test-Stack-Cleanup

      - name: Configure CodeArtifact auth
        uses: govuk-once/platform-actions/.github/actions/codeartifact-auth@fff749cdfd839413978a28697eea25c8d2f9e1e7 # Arbitrary version at branch
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE_ARN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci
      - run: pnpm run test