name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  QualityChecks:
    name: 🧪  Quality Checks
    secrets: inherit
    uses: ./.github/workflows/_quality_checks.yml

  DeployToDev:
    name: 🛠️ Deploy To Dev Env
    needs: QualityChecks
    secrets: inherit
    uses: ./.github/workflows/_build_deploy.yaml
    with:
      environment: dev
      aws_account: 513758042057 # govuk-app-infra-sandbox account
